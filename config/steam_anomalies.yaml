schema_version: steam_anomalies_v1
source: https://github.com/jdegene/steamHWsurvey/blob/master/README.md
rules:
  - id: cybercafe_overcount_bias
    start_month: 2017-08-01
    end_month: 2018-03-01
    category: ALL
    severity: high
    quality_flag: KNOWN_ANOMALY
    reason: Steam documented cybercafe overcount bias before the April 2018 fix.
    source_reference: https://github.com/jdegene/steamHWsurvey/blob/master/README.md#steam-hardware-survey-fix--522018
    recommended_action: retain_raw_review_in_derived_features
  - id: march_2023_sampling_movement
    start_month: 2023-03-01
    end_month: 2023-03-01
    category: ALL
    severity: high
    quality_flag: KNOWN_ANOMALY
    reason: Steam source documents unusual March 2023 movements and later mitigation.
    source_reference: https://github.com/jdegene/steamHWsurvey/blob/master/README.md
    recommended_action: retain_raw_review_in_derived_features
  - id: december_2024_source_revision
    start_month: 2024-12-01
    end_month: 2024-12-01
    category: ALL
    severity: medium
    quality_flag: SOURCE_CORRECTED
    reason: Steam source reports December 2024 inconsistencies and later recalculation from revised values.
    source_reference: https://github.com/jdegene/steamHWsurvey/issues/6
    recommended_action: retain_raw_record_revision_context
  - id: february_2026_questionable_observations
    start_month: 2026-02-01
    end_month: 2026-02-01
    category: ALL
    severity: high
    quality_flag: KNOWN_ANOMALY
    reason: Steam source identifies February 2026 as generally broken and averaged it with adjacent months.
    source_reference: https://github.com/jdegene/steamHWsurvey/issues/12
    recommended_action: exclude_from_derived_training_features_unless_reviewed
